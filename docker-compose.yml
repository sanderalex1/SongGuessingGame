services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: song_user
      POSTGRES_PASSWORD: song_pass
      POSTGRES_DB: song_guessing
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U song_user -d song_guessing"]
      interval: 3s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://song_user:song_pass@db:5432/song_guessing
      JWT_SECRET: dev-jwt-secret-change-me
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  pgdata:
